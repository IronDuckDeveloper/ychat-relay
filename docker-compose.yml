version: '3.8'

services:
  ychat-relay:
    build: .
    container_name: ychat-relay
    restart: unless-stopped
    ports:
      # Пробрасываем порт из переменной окружения или используем 15003 по умолчанию
      - "${PORT:-15003}:${PORT:-15003}"
    env_file:
      - .env
    volumes:
      # Привязка локальной папки data к папке внутри контейнера
      - ./data:/usr/src/app/data

  ychat-kubo:
    image: ipfs/kubo:latest
    container_name: ychat-kubo
    restart: unless-stopped
    ports:
      - "5001:5001"        # RPC API (клиент загружает файлы напрямую сюда)
      - "8081:8080"        # Gateway (клиент скачивает файлы по HTTP)
    volumes:
      # Именованные тома Docker для сохранения данных Kubo
      - kubo_data:/data/ipfs
      - kubo_export:/export
      - ./kubo-init.sh:/container-init.d/001-init.sh:ro

volumes:
  kubo_data:
  kubo_export:



