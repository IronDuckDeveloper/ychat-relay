worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=60r/m;

    server {
        listen 5001;
        client_max_body_size 20M;
        client_body_timeout 30s;
        send_timeout 30s;

        location /api/v0/add {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'x-session-token, Content-Type' always; 
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=upload_limit burst=5 nodelay;
            limit_conn conn_limit 3;
            auth_request /auth-check;

            proxy_hide_header Access-Control-Allow-Origin;   # Убирает заголовок Kubo перед тем как добавить свой
            add_header 'Access-Control-Allow-Origin' '*' always;

            proxy_pass http://ychat-kubo:5001/api/v0/add;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_request_buffering off;
        }

        location / {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                add_header 'Content-Length' 0;
                return 204;
            }
            return 403;
        }

        location = /auth-check {
            internal;
            proxy_pass http://ychat-relay:15004/api/check-upload;   # 👈 15004, НЕ 15003 (тот занят libp2p — см. ниже)
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header x-session-token $http_x_session_token;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }

        location /api/register-file {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'x-session-token, Content-Type' always;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=upload_limit burst=5 nodelay;
            limit_conn conn_limit 3;

            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://ychat-relay:15004/api/register-file;
        }

        location /api/delete-file {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'x-session-token, Content-Type' always;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=upload_limit burst=5 nodelay;
            limit_conn conn_limit 3;

            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://ychat-relay:15004/api/delete-file;
        }
    }

    server {
        listen 8080;

        location / {
            limit_req zone=gateway_limit burst=20 nodelay;
            proxy_pass http://ychat-kubo:8080;
        }
    }
}